name: Release & Deploy Workflow

trigger:
  - tag: v*

stages:
  - build
  - security_scan
  - publish
  - deploy

build:
  targets:
    - rust_binary
    - docker_image
    - npm_package

security_scan:
  tools:
    - cargo audit
    - trivy image
    - npm audit

publish:
  targets:
    - github_release
    - docker_registry
    - npm_registry

deploy:
  environments:
    - staging
    - production
  requires_approval: true
