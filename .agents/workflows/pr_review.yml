name: PR Review Workflow

trigger:
  - pull_request
  - pull_request_opened
  - pull_request_updated

stages:
  - lint
  - test
  - security
  - spec_audit
  - quality

lint:
  tools:
    - cargo fmt --check
    - cargo clippy
    - npm run lint

test:
  tools:
    - cargo test
    - npm run test

security:
  tools:
    - cargo audit
    - npm audit
    - trivy fs
    - trufflehog

spec_audit:
  description: Verify implementation matches SPEC.md
  required: true
  checks:
    - verify data models match SPEC
    - verify API schema matches SPEC
    - verify CLI commands match SPEC
    - verify database schema matches SPEC
    - verify adapter interface matches SPEC
    - verify notification system matches SPEC
    - verify webhook server matches SPEC

quality:
  checks:
    - coverage >= 80%
    - no critical_vulnerabilities
    - no secrets_found
    - spec_compliance_verified

notification:
  channels:
    - pr_comment
    - discord_on_failure
