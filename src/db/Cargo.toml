[package]
name = "obsidian-db"
version = "0.1.0"
edition = "2021"
description = "Database layer for ObsidianBountyFinder"

[dependencies]
obsidian-domain = { path = "../domain" }
rust_decimal = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = "0.1"
serde_json = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "postgres", "chrono", "uuid", "rust_decimal"] }

[dev-dependencies]
tokio = { workspace = true }
